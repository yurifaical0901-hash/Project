<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCME</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="left-panel">
            <h1>DPCM Enterprise</h1>

            <p>
                Empresa incrível que merece nota 10.
            </p>
        </div>

        <div class="right-panel">

            <div class="tabs">
                <button type="button" id="btnLogin" class="active">Entrar</button>
                <button type="button" id="btnCadastro">Cadastrar</button>
            </div>

            <!-- LOGIN -->

            <form id="loginForm">

                <h2>Bem-vindo</h2>

                <input type="email" id="loginEmail" placeholder="E-mail corporativo" required>

                <input type="password" id="loginSenha" placeholder="Senha" required>

                <button type="submit" class="main-btn">
                    Entrar
                </button>

                <a href="#">
                    Esqueceu sua senha?
                </a>
            </form>

            <!-- CADASTRO -->

            <form id="cadastroForm" class="hidden">

                <h2>Criar Conta</h2>

                <label for="tipoConta">Tipo de Conta</label>

                <select id="tipoConta" required>
                    <option value="pf">Pessoa Física</option>
                    <option value="pj">Pessoa Jurídica</option>
                </select>

                <input type="text" id="nome" placeholder="Nome Completo" required>

                <input type="email" id="email" placeholder="E-mail" required>

                <input type="text" id="telefone" maxlength="15" placeholder="(00) 00000-0000" required>

                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">

                <div id="cnpjField" class="hidden">

                    <input type="text" id="cnpj" maxlength="18" placeholder="00.000.000/0000-00">

                </div>

                <input type="date" id="nascimento" required>

                <select id="sexo" required>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Outro</option>
                    <option>Prefiro não informar</option>
                </select>

                <select id="cargo" required>
                    <option value="">Cargo</option>
                    <option>Funcionário</option>
                    <option>RH</option>
                    <option>Gerente</option>
                </select>

                <input type="password" id="senha" placeholder="Senha" required>

                <input type="password" id="confirmarSenha" placeholder="Confirmar Senha" required>

                <button type="submit" class="main-btn">
                    Cadastrar
                </button>

            </form>

        </div>

    </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
